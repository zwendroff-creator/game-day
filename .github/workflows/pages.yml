name: Publish app
on:
  push: { branches: [main] }
  schedule:
    - cron: '0 9 * * *' # daily, so the cycling calendar stays fresh
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm test
        env: { TZ: America/New_York }
      - run: mkdir site && cp -r index.html app.js feeds.js sources.js cyclocross.js ranking.js push-config.js styles.css sw.js manifest.json icons site/
      - run: node tools/cycling.mjs site/cycling.json
      - run: node tools/teams.mjs site/teams.json
      - run: node tools/logos.mjs site/logos.json
        continue-on-error: true
      - run: node tools/upcoming.mjs site/upcoming.json
        env: { TZ: America/New_York }
      - run: node tools/cxtimes.mjs site/cx-times.json
        continue-on-error: true
        env: { TZ: America/New_York }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@v4
